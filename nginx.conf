# Performance optimizations for high throughput
worker_processes auto;
worker_rlimit_nofile 65535;

# Events block for connection handling
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    # Basic performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Request body handling for JSON APIs
    client_body_buffer_size 128k;
    client_max_body_size 20M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Define upstream for load balancing - explicit server instances
    upstream backend_servers {
        least_conn;  # Load balancing method
        
        # Explicitly define all scaled server instances
        server onconova-server-1:8000 max_fails=2 fail_timeout=5s;
        server onconova-server-2:8000 max_fails=2 fail_timeout=5s;
        server onconova-server-3:8000 max_fails=2 fail_timeout=5s;
        server onconova-server-4:8000 max_fails=2 fail_timeout=5s;
        server onconova-server-5:8000 max_fails=2 fail_timeout=5s;
        
        keepalive 16;  # Connection pool per server
        keepalive_requests 100;
        keepalive_timeout 30s;
    }

    # Rate limiting - increased for high throughput
    limit_req_zone $binary_remote_addr zone=api:10m rate=5000r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=2000r/s;

    # Redirect all non-encrypted (HTTP) to encrypted (HTTPS)
    server {
        # Listen to HTTP requests
        listen 80;
        # Redirect to HTTPS requests
        return 301 https://$host$request_uri;
        # Setup max size for uploads (default 1MB)
        client_max_body_size 20M;
    }

    server { 
        
        # Listen only to HTTPS requests
        listen [::]:443 ssl http2;
        listen 443 ssl http2; 

        
        # Setup max size for uploads (default 1MB)
        client_max_body_size 20M;

        # SSL settings - optimized
        ssl_certificate /etc/nginx/ssl/cert_host.pem;
        ssl_certificate_key /etc/nginx/ssl/cert_host.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Proxy settings for frontend
        location / {
            limit_req zone=general burst=200 nodelay;
            
            # Redirect all HTTP traffic to client container
            proxy_pass http://client;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }
        
        # API endpoints with load balancing
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            
            # Use upstream for load balancing
            proxy_pass http://backend_servers/api/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            
            # Essential for JSON/POST request handling
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Request body handling - crucial for JSON
            proxy_request_buffering on;
            client_body_buffer_size 128k;
            client_body_timeout 60s;
            
            # Timeouts - increased for JSON processing
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Response buffering optimized for JSON
            proxy_buffering on;
            proxy_buffer_size 64k;
            proxy_buffers 8 64k;
            proxy_busy_buffers_size 128k;
            proxy_temp_file_write_size 128k;
            
            # Ensure content length is preserved
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
        }
        
        # Serve static files with caching
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # Serve media files with caching
        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
